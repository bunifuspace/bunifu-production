<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><meta name="description" content="A fast, private document scanner built for the web."><title>BuniDoc</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/script.css"></head><body><main class="app"><header class="topbar"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-camera"></i></div><div><h1>BuniDoc &trade;</h1><span>Bunifuvision</span></div></div><button class="icon-button" id="settingsButton" aria-label="Settings"><i class="fa-solid fa-gear"></i></button></header><section class="scanner-view" id="scannerView"><div class="camera-container"><video id="camera" autoplay playsinline muted></video><canvas id="cameraCanvas"></canvas><div class="scanner-overlay"><div class="corner top-left"></div><div class="corner top-right"></div><div class="corner bottom-left"></div><div class="corner bottom-right"></div></div><div class="camera-status"><span class="status-dot"></span> <span id="cameraStatus">Camera ready</span></div></div><div class="camera-controls"><button class="control-button" id="galleryButton"><i class="fa-regular fa-images"></i> <span>Gallery</span></button> <button class="capture-button" id="captureButton" aria-label="Capture document"><span></span></button> <button class="control-button" id="flashButton"><i class="fa-solid fa-bolt"></i> <span>Flash</span></button></div><div class="camera-options"><button id="cameraSwitchButton"><i class="fa-solid fa-camera-rotate"></i></button> <button id="zoomButton"><span id="zoomValue">1×</span></button></div></section><section class="editor-view hidden" id="editorView"><header class="editor-header"><button class="back-button" id="editorBackButton"><i class="fa-solid fa-arrow-left"></i></button><div><h2>Edit document</h2><span id="pageCounter">Page 1</span></div><button class="done-button" id="editorDoneButton">Done</button></header><div class="editor-canvas-container"><canvas id="editorCanvas"></canvas><div class="crop-overlay" id="cropOverlay"><div class="crop-handle top-left"></div><div class="crop-handle top-right"></div><div class="crop-handle bottom-left"></div><div class="crop-handle bottom-right"></div></div></div><div class="filter-section"><h3>Filters</h3><div class="filter-list"><button class="filter active" data-filter="original"><span class="filter-preview original"></span> <span>Original</span></button> <button class="filter" data-filter="document"><span class="filter-preview document"></span> <span>Document</span></button> <button class="filter" data-filter="grayscale"><span class="filter-preview grayscale"></span> <span>Gray</span></button> <button class="filter" data-filter="bw"><span class="filter-preview bw"></span> <span>B&W</span></button></div></div><div class="adjustment-section"><h3>Adjust</h3><div class="slider-row"><label for="brightness">Brightness</label> <input type="range" id="brightness" min="-100" max="100" value="0"></div><div class="slider-row"><label for="contrast">Contrast</label> <input type="range" id="contrast" min="-100" max="100" value="0"></div></div><div class="editor-tools"><button id="cropButton"><i class="fa-solid fa-crop-simple"></i> <span>Crop</span></button> <button id="rotateButton"><i class="fa-solid fa-rotate-right"></i> <span>Rotate</span></button> <button id="resetButton"><i class="fa-solid fa-arrow-rotate-left"></i> <span>Reset</span></button></div></section><section class="documents-view hidden" id="documentsView"><header class="documents-header"><div><h2>Documents</h2><span id="documentCount">0 pages</span></div><button class="icon-button" id="clearDocumentsButton"><i class="fa-solid fa-trash"></i></button></header><div class="page-grid" id="pageGrid"></div><div class="documents-actions"><button class="secondary-button" id="addPageButton"><i class="fa-solid fa-plus"></i> Add page</button> <button class="primary-button" id="exportButton"><i class="fa-solid fa-file-pdf"></i> Export PDF</button></div></section><nav class="bottom-navigation"><button class="nav-item active" id="scanNav"><i class="fa-solid fa-camera"></i> <span>Scan</span></button> <button class="nav-item" id="documentsNav"><i class="fa-regular fa-folder"></i> <span>Documents</span></button> <button class="nav-item" id="importNav"><i class="fa-regular fa-image"></i> <span>Import</span></button></nav></main><input type="file" id="fileInput" accept="image/*" multiple="multiple" hidden><div class="modal hidden" id="settingsModal"><div class="modal-backdrop"></div><div class="modal-content"><div class="modal-header"><h2>Settings</h2><button class="icon-button" id="closeSettingsButton"><i class="fa-solid fa-xmark"></i></button></div><div class="settings-list"><div class="setting"><div><strong>Auto capture</strong> <span>Capture when the document is stable</span></div><label class="switch"><input type="checkbox" id="autoCapture"> <span></span></label></div><div class="setting"><div><strong>Save locally</strong> <span>Keep scanned pages in this browser</span></div><label class="switch"><input type="checkbox" id="localStorageSetting" checked="checked"> <span></span></label></div><div class="setting"><div><strong>High quality</strong> <span>Use higher resolution for exports</span></div><label class="switch"><input type="checkbox" id="highQuality" checked="checked"> <span></span></label></div></div></div></div><div class="toast hidden" id="toast"></div><script src="script/app.js"></script></body></html>
